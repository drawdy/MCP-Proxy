name: CI

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            docker:
              - '.github/workflows/ci.yml'
              - 'Dockerfile'
              - 'compose.yml'
              - '.dockerignore'
              - 'config.example.json'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf '{"mcpServers":{}}\n' > config.json
      - run: docker compose -f compose.yml config
      - run: docker compose -f compose.yml up -d --build
      - name: Verify writable runtime volumes
        run: |
          docker compose -f compose.yml exec -T mcp-proxy sh -ec '
            test "$HOME" = "/home/mcp"
            for dir in /home/mcp/.npm /home/mcp/.claude-server-commander /home/mcp/.claude-server-commander-logs; do
              test -d "$dir" && test -w "$dir"
              touch "$dir/.write-test" && rm "$dir/.write-test"
            done
          '
      - if: always()
        run: docker compose -f compose.yml down -v
